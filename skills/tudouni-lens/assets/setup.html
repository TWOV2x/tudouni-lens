<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接土豆泥图视</title>
<style nonce="__NONCE__">
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#f3f4ef;background:#121411;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);padding:36px;border:1px solid #353a30;border-radius:22px;background:#1b1e18;box-shadow:0 22px 80px #0004}.brand{display:flex;align-items:center;gap:12px;color:#bbeb45;font-size:14px;font-weight:600}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:9px;background:#bbeb45;color:#151a0b;font-size:23px;object-fit:cover}h1{font-size:26px;letter-spacing:-.6px;margin:29px 0 12px}p{color:#afb6a6;font-size:14px;line-height:1.8;margin:0 0 25px}label{display:block;font-size:14px;font-weight:600;margin:0 0 10px}input{width:100%;padding:14px 15px;border:1px solid #515a42;border-radius:10px;background:#11140e;color:#fff;font-size:16px;outline:none}input:focus-visible,button:focus-visible{outline:3px solid #c0ec58;outline-offset:3px}button{width:100%;border:0;border-radius:10px;padding:14px 16px;font-size:15px;font-weight:650;background:#bee94b;color:#151b07;cursor:pointer;margin-top:20px;min-height:48px}button:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;color:#909986;line-height:1.7;margin-top:14px}.message{font-size:14px;line-height:1.7;margin:18px 0 0;color:#ffb6a9;white-space:pre-line}.message.success{color:#c5e68e}.done{margin-top:26px;padding:18px;border:1px solid #465331;border-radius:12px;background:#28331d}.done h2{margin:0 0 8px;font-size:20px}.done p{margin:0}footer{color:#757f6b;font-size:12px;margin-top:27px} [hidden]{display:none!important}@media(max-width:480px){main{padding:25px}h1{font-size:24px}}
</style></head><body><main><div class="brand"><img class="mark" src="/logo.png" alt="土豆泥图视" width="48" height="48">土豆泥图视</div><h1>连接后，即可开始创作</h1><p id="intro">粘贴你的土豆泥 API Key。我们会自动验证并保存，之后无需重复填写。</p><form id="connect"><label for="key">API Key</label><input id="key" type="password" placeholder="在这里粘贴 Key" autocomplete="off" spellcheck="false" autocapitalize="none" required aria-describedby="privacy"><button id="save" type="submit">保存并开始使用</button><div id="privacy" class="hint">Key 只保存到本机，不会放进聊天。验证时仅连接土豆泥网站，不会生成作品。</div></form><div id="message" class="message" role="status" aria-live="polite"></div><section id="done" class="done" hidden><h2>连接成功</h2><p>已经保存好了。返回助手，它会继续刚才的创作；这个窗口可以关闭。</p></section><footer>图片 · 视频 · 自动保存</footer></main>
<script nonce="__NONCE__">
const capability=location.hash.slice(1),form=document.querySelector('#connect'),input=document.querySelector('#key'),button=document.querySelector('#save'),message=document.querySelector('#message');
if(!capability){message.textContent='窗口连接已失效，请让助手重新打开配置窗口。';button.disabled=true;}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='正在验证…';message.textContent='';try{const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':capability},body:JSON.stringify({key:input.value})});const result=await response.json();if(!response.ok||!result.ok){message.textContent=result.message||'未能完成连接，请在这个窗口重试。';return;}input.value='';form.hidden=true;document.querySelector('#intro').hidden=true;document.querySelector('#done').hidden=false;message.textContent='';history.replaceState(null,'',location.pathname);}catch{message.textContent='本机配置窗口暂时无法连接，请让助手重新打开；不要重复创建或移动文件。';}finally{button.disabled=false;button.textContent='保存并开始使用';}});
</script></body></html>
